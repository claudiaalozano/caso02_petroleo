name: Daily Oil Data Update

on:
  schedule:
    - cron: '30 8 * * *'
      timezone: "Europe/Madrid"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance pandas-datareader

      - name: Download oil market data
        run: |
          python scripts/download_data.py

      - name: Commit and push updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/petroleo_dataset.csv

          if git diff --cached --quiet; then
            echo "No new data available"
          else
            git commit -m "Automatic daily oil dataset update"
            git push
          fi